name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.0'
      - name: Build
        run: gradle build --no-daemon
      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-jar
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Resolve release info
        if: startsWith(github.ref, 'refs/tags/')
        id: rel
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "title=MikuMOTD ${VER}" >> "$GITHUB_OUTPUT"
          # 版本规则（主版本.正式版.测试版）：第三位 > 0 → 预发布；= 0 → 正式版
          PATCH="${VER##*.}"
          case "$PATCH" in
            0) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
          esac
          # 更新日志取自本次发版提交的正文（%b 不含首行标题）；正文为空则不设置 body_path
          git log -1 --format=%b HEAD > release-body.md
          if [ -s release-body.md ]; then
            echo "body_path=release-body.md" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.rel.outputs.title }}
          files: build/libs/*.jar
          prerelease: ${{ steps.rel.outputs.prerelease }}
          body_path: ${{ steps.rel.outputs.body_path }}
          generate_release_notes: ${{ steps.rel.outputs.body_path == '' }}
